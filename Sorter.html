<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title></title>
  </head>
  <body>
    <input type="button" onclick="extractorMax()" value="Convert">
    <br>
    <div style="min-width:160px;height:250px; max-height:250px;border: 1px solid black;overflow:hidden;" contenteditable="true" id="input"></div>
    <textarea style="width:100%;height:250px; max-height:250px;border: 1px solid black;overflow:hidden;" id="output"></textarea>
    <script type="text/javascript">
      // sort html
      function extractorMax() {
        let htmltxt = document.getElementById('input').innerText;
        let segs = htmltxt.split("<");
        let typo = new Object();
        for (var i = 1; i < segs.length; i++) {
          let parts = segs[i].split("");
          if (parts[0] == "/") {
            typo[i] = "end";
          }
          else {
            typo[i] = "str";
          }
        }
        let pointers = Object.keys(typo);
        let spcermanger = new Object();
        let finelHtml = "";
        for (var i = 1; i < pointers.length; i++) {
          if (i == 1) {
            spcermanger[i] = 0
          }
          else if (i == (pointers.length - 1)) {
            spcermanger[i] = 0;
          }
          else {
            if (typo[i-1] == "str") {
              if (findtagsingle(segs[i-1])) {
                if (typo[i] == "str") {
                  spcermanger[i] = spcermanger[i-1];
                }
                else {
                  spcermanger[i] = spcermanger[i-1] - 1;
                }
              }
              else if (typo[i] == "str") {
                spcermanger[i] = spcermanger[i-1] + 1;
              }
              else if (typo[i] == "end") {
                spcermanger[i] = spcermanger[i-1];
              }
            }
            else if (typo[i-1] == "end") {
              if (typo[i] == "str") {
                spcermanger[i] = spcermanger[i-1];
              }
              else if (typo[i] == "end") {
                spcermanger[i] = spcermanger[i-1] - 1;
              }
            }
          }
        }
        for (var i = 1; i < segs.length; i++) {
          let space = (spcermanger[i]) * 2;
          if (i == 1 || i == (segs.length - 1)) {
            finelHtml += "<" + segs[i] + "\n";
          }
          else {
            let tabs = "";
            for (var x = 0; x < space; x++) {
              tabs += " ";
            }
            finelHtml += tabs;
            finelHtml += "<" + segs[i] + "\n";
          }
        }
        document.getElementById('input').innerText = "";
        jssorter(csssorter(finelHtml));
        // document.getElementById('output').value = finelHtml;
      }
      // sort css
      function csssorter(input) {
        let segs = input.split("<style");
        let out_txt = segs[0];
        for (var i = 1; i < segs.length; i++) {
          let css_ext = segs[i].split("</style>");
          let end_cap = "</style>" + css_ext[1];
          let css_ty = css_ext[0].split(">");
          let str_cap = "<style" + css_ty[0] + ">\n";
          let css_txt = css_ty[1];
          let css_segs = css_txt.split("}");
          css_txt = "";
          for (var x = 0; x < (css_segs.length - 1); x++) {
            // console.log(css_segs[css_segs.length-2]);
            // return
            if (i == (css_segs.length - 2)) {
              css_txt += css_segs[x] + "\n";
            }
            else {
              css_txt += css_segs[x] + "}\n";
            }
          }
          out_txt += str_cap + css_txt + end_cap;
        }
        return out_txt;
      }
      // js sorter
      function jssorter(input) {
        let output = "", pre_output = "";
        let jss = input.split("<script");
        output = jss[0];
        let codejs = "</" + "script>";
        for (var y = 1; y < jss.length; y++) {
          let spaman = jss[(y-1)].split(">");
          let spacer = spaman[spaman.length - 1].replace("\n", "") + "  ";
          let sparetor = jss[y].split(codejs);
          if (sparetor[0] != "") {
            let toFindHead = sparetor[0].split(">");
            let jscript = sparetor[0].replace(`${toFindHead[0]}>`, "");
            let str_cap = `<script${toFindHead[0]}>`;
            let end_cap = codejs + sparetor[1];
            let partun = jscript.split("{");
            for (var i = 0; i < partun.length; i++) {
              if (i == (partun.length - 1)) {
                pre_output += partun[i];
              }
              else {
                pre_output += partun[i] + "{\n";
              }
            }
            let end_break = [");", ")}", "})", "];"];
            for (var i = 0; i < end_break.length; i++) {
              let txtbox = pre_output.split(end_break[i]);
              pre_output = "";
              for (var x = 0; x < txtbox.length; x++) {
                if (x == (txtbox.length - 1)) {
                  pre_output += spaman + txtbox[x];
                }
                else {
                  if (txtbox[x+1] == "") {
                    pre_output += spaman + txtbox[x];
                  }
                  else {
                    pre_output += spaman + txtbox[x] + `${end_break[i]}\n`;
                  }
                }
              }
            }
            output += str_cap + pre_output + end_cap;
            for (var i = 0; i < 2; i++) {
              output = output.replaceAll("\n\n", "\n");
            }
            document.getElementById('output').value += output;
          }
        }
      }
      // essantiol helps the html sorter
      function findtagsingle(sent) {
        const htmlSingleTags = ["area","base","br","col","embed","hr","img","input","link","meta","source","track","wbr", "!--"];
          //.startsWith(checkerAR[lastitemX].toLowerCase())
        for (var i = 0; i < htmlSingleTags.length; i++) {
          if (sent.startsWith(htmlSingleTags[i])) {
            return true;
          }
        }
        return false;
      }
    </script>
  </body>
</html>
